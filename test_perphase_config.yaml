global_config:
  model: "anthropic/claude-4-sonnet-20250522"
  temperature: 0.7
  max_tokens: 20000
  file_size_validation:
    enabled: true
    max_size_difference_percent: 1000  # Allow large size differences for testing

# Input and output configuration
input_file: test_input_perphase.md
output_file: test_output_perphase.md

# Chain-level preprocessing and postprocessing (from previous feature)
preprocessing:
  script01: echo "Global preprocessing started"
  name01: "Global Setup"

postprocessing:
  script01: echo "Global postprocessing completed"
  name01: "Global Cleanup"

# Prompt chain with per-phase scripts
prompts:
  prompt 1:
    prescript: "touch {input_file}.prescript_marker"
    name: "grammar_foundation"
    prompt_file: "prompts/test_prompt1.json"
    model: "anthropic/claude-4-sonnet-20250522"  # Using available model
    temperature: 0.2
    postscript: "ls -haltr {output_file}"

  prompt 2:
    prescript: "echo 'Step 2 prescript with input: {input_file}'"
    name: "content_enhancement"
    prompt_file: "prompts/test_prompt1.json"
    temperature: 0.5
    postscript: "wc -l {output_file} > {output_file}.word_count"