# Multi-File Prompt Chain Configuration Example
# This config processes multiple input files through the same prompt chain

# Multiple input files
input_files:
  - "document1.md"
  - "document2.md"
  - "document3.txt"

# Output pattern - generates unique output files for each input
output_pattern: "processed_{input_name}_output{input_ext}"

# Prompts with per-step configuration
prompts:
  prompt 1:
    prompt_file: "analysis.json"
    config_file: "claude_config.yaml"  # Use Claude for analysis
  
  prompt 2:
    prompt_file: "refinement.json"
    config_file: "gpt4_config.yaml"   # Use GPT-4 for refinement
  
  prompt 3: "final_polish.json"  # Uses global config or defaults