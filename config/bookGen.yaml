# bookGen.yaml

# Your OpenRouter API Key. Get it from https://openrouter.ai/keys
# This will be used if the OPENROUTER_API_KEY environment variable is not set.
# IMPORTANT: Replace "sk-or-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" with your actual API key,
# or ensure the OPENROUTER_API_KEY environment variable is set.
openrouter_api_key: "sk-or-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# The specific model to use. OpenRouter typically uses Anthropic's official names.
# 'anthropic/claude-3-opus' is a powerful option. Check OpenRouter's models page for others.
model: "anthropic/claude-4-sonnet-20250522"
# The base URL for the OpenRouter chat completions API.
api_base_url: "https://openrouter.ai/api/v1/chat/completions"

# Default file paths for input and output.
# These can be overridden by passing different files to the script.
input_chapter_file: "chapter_input.md"
action_prompt_file: "action_prompt.json"
output_chapter_file: "chapter_output.md"

# Logging level: DEBUG, INFO, WARNING, ERROR, CRITICAL
# Default is INFO.
log_level: "INFO"
