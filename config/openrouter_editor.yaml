# OpenRouter Text Editor Configuration File
# This file contains all configuration options with their default values

# =============================================================================
# FILE SETTINGS
# =============================================================================

# Input and output file paths
input_file: 'input.md'                    # Source file to process
output_file: 'output.md'                  # Where to save the processed result
action_file: 'action.json'                # JSON file containing editing instructions

# Payload and log files
payload_file: 'openrouter_editor.payload.json'  # API request payload (for debugging)

# =============================================================================
# LOGGING SETTINGS
# =============================================================================

log_level: 'INFO'                         # Logging level: DEBUG, INFO, WARNING, ERROR
log_to_file: false                        # Whether to log to file instead of console
log_file: 'openrouter_editor.log'         # Log file path (when log_to_file is true)

# =============================================================================
# API SETTINGS
# =============================================================================

# OpenRouter API configuration
model: 'anthropic/claude-4-sonnet-20250522'  # Model to use for text processing
api_base_url: 'https://openrouter.ai/api/v1' # OpenRouter API base URL
temperature: 0.8                          # Creativity/randomness (0.0 - 1.0)
max_tokens: 10000                         # Maximum response length

# API key can be set here or via OPENROUTER_API_KEY environment variable
# api_key: 'your-api-key-here'            # Uncomment and add your API key

# =============================================================================
# COMPLIANCE CHECK SETTINGS
# =============================================================================

enable_compliance_check: true             # Whether to run compliance analysis
compliance_output_file: 'compliance_analysis.md'  # Where to save compliance report

# =============================================================================
# CHUNKING SETTINGS
# =============================================================================

enable_chunking: false                    # Whether to split large files into chunks
chunk_size: 1000                          # Target words per chunk
chunk_identifier: 'ch'                    # Chunk naming identifier (input-ch1.md, input-ch2.md)

# =============================================================================
# ADVANCED CHUNKING OPTIONS
# =============================================================================

# These options are used internally by the TextChunker class
# You can override them if needed for specific use cases

# chunk_prefix: ''                        # Auto-generated from input filename
# chunk_suffix: 'md'                      # File extension for chunks
# cleanup_chunks: true                    # Remove intermediate files after combining
# chunk_separator: '\n\n---\n\n'          # Separator between chunks when combining
# preserve_metadata: true                 # Preserve YAML front matter in first chunk

# =============================================================================
# EXAMPLE CONFIGURATIONS
# =============================================================================

# Example 1: Basic usage (minimal config)
# input_file: 'my_document.md'
# output_file: 'edited_document.md'
# model: 'anthropic/claude-4-sonnet-20250522'

# Example 2: Large file processing with chunking
# enable_chunking: true
# chunk_size: 1500
# chunk_identifier: 'part'
# input_file: 'large_book.md'
# output_file: 'edited_book.md'

# Example 3: Debug mode with file logging
# log_level: 'DEBUG'
# log_to_file: true
# log_file: 'debug.log'
# enable_compliance_check: true

# Example 4: Custom model and settings
# model: 'anthropic/claude-4-opus-20250522'
# temperature: 0.3
# max_tokens: 8000
# enable_compliance_check: false

# Example 5: Production settings
# log_level: 'WARNING'
# enable_chunking: true
# chunk_size: 2000
# cleanup_chunks: true
# enable_compliance_check: true

# =============================================================================
# NOTES
# =============================================================================

# 1. API Key Security:
#    - It's recommended to use the OPENROUTER_API_KEY environment variable
#    - Only add api_key to this file if you're sure it's secure
#    - Never commit API keys to version control

# 2. File Paths:
#    - All file paths are relative to where you run the script
#    - You can use absolute paths if needed
#    - Make sure the script has write permissions for output files

# 3. Chunking Guidelines:
#    - Enable chunking for files larger than ~3000 words
#    - Adjust chunk_size based on your model's context window
#    - Smaller chunks = more API calls but better processing
#    - Larger chunks = fewer API calls but may hit limits

# 4. Model Selection:
#    - claude-4-sonnet-20250522: Good balance of speed and quality
#    - claude-4-opus-20250522: Highest quality, slower and more expensive
#    - Check OpenRouter for latest available models

# 5. Temperature Settings:
#    - 0.0-0.3: More focused and deterministic
#    - 0.4-0.7: Balanced creativity and consistency  
#    - 0.8-1.0: More creative and varied output