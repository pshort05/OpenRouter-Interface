# Gemini Humanizer - Complete 30 Chapter Processing
# Single YAML file to process all 30 chapters through 4-stage humanization pipeline
# Run with: openrouter-chain -c GeminiHumanizer/process_all_30_chapters.yaml

global_config:
  model: "google/gemini-3-pro-preview"
  temperature: 0.7
  max_tokens: 30000

# This chain processes ALL 30 chapters sequentially
# Each chapter goes through all 4 phases before moving to the next chapter
# Total: 120 prompt executions (30 chapters × 4 phases)

# Input: chapter_1.md through chapter_30.md (in current directory)
# Output: chapter_1_humanized.md through chapter_30_humanized.md (in humanized_chapters/)

input_file: "chapter_1.md"
output_file: "humanized_chapters/chapter_30_humanized.md"

preprocessing:
  script01: echo "========================================"
  name01: "Start Processing"
  script02: echo "Gemini Humanizer: Processing 30 Chapters"
  name02: "Display Header"
  script03: echo "4 Phases per Chapter = 120 Total Steps"
  name03: "Show Stats"
  script04: echo "========================================"
  name04: "Separator"
  script05: mkdir -p humanized_chapters
  name05: "Create Output Directory"

postprocessing:
  script01: echo "========================================"
  name01: "Completion Header"
  script02: echo "All 30 Chapters Processed!"
  name02: "Success Message"
  script03: "ls -lh humanized_chapters/chapter_*_humanized.md | wc -l | xargs echo 'Files created:'"
  name03: "Count Outputs"
  script04: echo "========================================"
  name04: "Final Separator"

prompts:
  # ==================== CHAPTER 1 ====================
  ch01_phase1:
    name: "ch01_phase1_foundational"
    prompt_file: "GeminiHumanizer/1_foundational_cleanup.json"
    temperature: 0.6
    max_tokens: 30000
    prescript: "cp chapter_1.md humanized_chapters/chapter_1_temp.md && echo 'Chapter 1 - Phase 1: Foundational Cleanup'"
    postscript: "cp {output_file} humanized_chapters/chapter_1_temp.md"

  ch01_phase2:
    name: "ch01_phase2_stylistic"
    prompt_file: "GeminiHumanizer/2_stylistic_narrative_enhancement.json"
    temperature: 0.7
    max_tokens: 30000
    prescript: "cp humanized_chapters/chapter_1_temp.md /tmp/input_temp.md && echo 'Chapter 1 - Phase 2: Stylistic Enhancement'"
    postscript: "cp {output_file} humanized_chapters/chapter_1_temp.md"

  ch01_phase3:
    name: "ch01_phase3_structural"
    prompt_file: "GeminiHumanizer/3_advanced_structural_statistical_humanization.json"
    temperature: 0.75
    max_tokens: 30000
    prescript: "cp humanized_chapters/chapter_1_temp.md /tmp/input_temp.md && echo 'Chapter 1 - Phase 3: Structural Humanization'"
    postscript: "cp {output_file} humanized_chapters/chapter_1_temp.md"

  ch01_phase4:
    name: "ch01_phase4_dialogue"
    prompt_file: "GeminiHumanizer/4_dialogue_refinement.json"
    temperature: 0.8
    max_tokens: 30000
    prescript: "cp humanized_chapters/chapter_1_temp.md /tmp/input_temp.md && echo 'Chapter 1 - Phase 4: Dialogue Refinement'"
    postscript: "cp {output_file} humanized_chapters/chapter_1_humanized.md && rm humanized_chapters/chapter_1_temp.md && echo '✓ Chapter 1 Complete'"

  # ==================== CHAPTER 2 ====================
