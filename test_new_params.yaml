input_file: "test_input.md"
output_file: "test_new_params_output.md"

# Global config with some of the new parameters
global_config:
  model: "anthropic/claude-4-sonnet-20250522"
  temperature: 0.7
  max_tokens: 15000
  top_p: 0.9
  seed: 123
  frequency_penalty: 0.1
  usage:
    include: true

prompts:
  prompt 1:
    name: "test_precision"
    prompt_file: "prompts/test_prompt1.json"
    temperature: 0.3              # Override for precision
    top_k: 25                     # Test top_k parameter
    presence_penalty: 0.2         # Test presence_penalty

  prompt 2:
    name: "test_creative"
    prompt_file: "prompts/test_prompt2.json"
    temperature: 0.8              # Override for creativity
    min_p: 0.02                   # Test min_p parameter
    user: "test_user_123"         # Test user parameter