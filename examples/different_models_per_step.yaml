# OpenRouter Chain Configuration - Different Models Per Step Example
# This configuration demonstrates the new per-step model functionality

# Input files to process
input_files:
  - article.md
  - research_paper.md
  - blog_post.md

# Output file naming pattern
output_pattern: "enhanced_{input_name}{input_ext}"

# Sequential prompts with different models for each step
prompts:
  # Step 1: Initial analysis with Gemini 2.0 Flash (fast and efficient)
  analysis:
    prompt_file: content_analysis.json
    model: google/gemini-2.0-flash-001
  
  # Step 2: Deep content enhancement with Claude Sonnet (high quality reasoning)
  enhancement:
    prompt_file: content_enhancement.json
    model: anthropic/claude-4-sonnet-20250522
  
  # Step 3: Final polish with GPT-4o (excellent writing style)
  polish:
    prompt_file: content_polish.json
    model: openai/gpt-4o
  
  # Step 4: Quality check with Gemini Pro (cost-effective validation)
  validation:
    prompt_file: quality_check.json
    model: google/gemini-pro

# Global configuration (used as fallback for steps without explicit models)
global_config:
  api_base_url: https://openrouter.ai/api/v1
  temperature: 0.7
  max_tokens: 4000
  log_level: INFO

# This configuration will process each input file through all 4 steps:
# 1. article.md -> Gemini analysis -> Claude enhancement -> GPT-4o polish -> Gemini validation -> enhanced_article.md
# 2. research_paper.md -> [same 4-step process] -> enhanced_research_paper.md  
# 3. blog_post.md -> [same 4-step process] -> enhanced_blog_post.md

# Usage:
# ./openrouter-chain -c examples/different_models_per_step.yaml