# OpenRouter Chain Configuration - Multi-file Processing Example
# This configuration runs multiple prompts against multiple input files using Gemini

# Multiple input files to process
input_files:
  - file1.md
  - file2.md  
  - file3.md

# Output file naming pattern
# {input_name} = filename without extension (file1, file2, file3)
# {input_ext} = original file extension (.md)
output_pattern: "processed_{input_name}_final{input_ext}"

# Sequential prompts to run on each file
prompts:
  # Step 1: Run 1.json on each file
  prompt 1: 1.json
  
  # Step 2: Run 2.json on the output from step 1
  prompt 2: 2.json
  
  # Step 3: Run 3.json on the output from step 2
  prompt 3: 3.json

# Global configuration for all prompt executions
# This will create a config file for each prompt_runner.py execution
global_config:
  model: google/gemini-2.0-flash-001
  api_base_url: https://openrouter.ai/api/v1
  temperature: 0.7
  max_tokens: 8000
  log_level: INFO

# Execution will create these final outputs:
# - processed_file1_final.md (file1.md -> 1.json -> 2.json -> 3.json)
# - processed_file2_final.md (file2.md -> 1.json -> 2.json -> 3.json)
# - processed_file3_final.md (file3.md -> 1.json -> 2.json -> 3.json)

# Usage:
# openrouter-chain -c sample_multi_file_chain.yaml
# or
# ./openrouter-chain -c sample_multi_file_chain.yaml