input_file: test_input_simple.md
output_file: test_override_output.md

# Global file size validation settings
global_config:
  file_size_validation:
    enabled: true
    max_size_difference_percent: 40  # Global setting
    min_file_size_bytes: 100

prompts:
  prompt 1:
    name: strict_validation
    prompt_file: test_simple_prompt.json
    max_size_difference_percent: 20  # Override to be more strict for this step

  prompt 2:
    name: lenient_validation
    prompt_file: test_simple_prompt.json
    file_size_validation:
      max_size_difference_percent: 60  # Override to be more lenient for this step
      min_file_size_bytes: 50

  prompt 3:
    name: default_validation
    prompt_file: test_simple_prompt.json
    # Uses global setting (40%)